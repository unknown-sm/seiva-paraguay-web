    <meta property="og:title" content="Seiva Paraguay — Suplementos, Vitaminas y Bienestar" />

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="preload" as="image" href="/images/hero-bottle.jpg" fetchpriority="high">
      <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
      <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap"></noscript>
     <script>
       (function() {
         var API = location.hostname === 'localhost' ? 'http://localhost:3001/api' : '/api';
         fetch(API + '/contenido').then(function(r) { return r.json() }).then(function(data) {
           if (data.site_titulo) {
             document.title = data.site_titulo;
             document.querySelector('meta[property="og:title"]').content = data.site_titulo;
             document.querySelector('meta[name="twitter:title"]').content = data.site_titulo;
           }
           if (data.site_descripcion) {
             document.querySelector('meta[property="og:description"]').content = data.site_descripcion;
             document.querySelector('meta[name="twitter:description"]').content = data.site_descripcion;
           }
             if (data.site_favicon) {
               var link = document.createElement('link');
               link.rel = 'icon';
               link.type = data.site_favicon.indexOf('.svg') !== -1 ? 'image/svg+xml' : 'image/png';
               link.href = data.site_favicon;
               document.head.appendChild(link);
             }
            if (data.site_logo) {
              document.querySelector('meta[property="og:image"]').content = data.site_logo;
              document.querySelector('meta[name="twitter:image"]').content = data.site_logo;
            }
         }).catch(function() {});
       })();
     </script>
   </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
