services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: ecommerce_agent
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d ecommerce_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # n8n accede al backend del host mediante http://host.docker.internal:3001
  n8n:
    image: n8nio/n8n:latest
    container_name: ecommerce-agent-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=ecommerce_agent
      - DB_POSTGRESDB_USER=agent
      - DB_POSTGRESDB_PASSWORD=agent
      - N8N_DIAGNOSTICS_ENABLED=false
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - WEBHOOK_URL=https://TU-DOMINIO-O-NGROK.app/
    ports:
      - "5678:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
