<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <title>OpenCode Mobile</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="logo">⚡</span>
        <div class="header-info">
          <span class="header-title">OpenCode</span>
          <span id="status" class="status disconnected">Desconectado</span>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-restart" class="btn-icon" title="Reiniciar" style="display:none">↻</button>
        <button id="btn-stop" class="btn-icon" title="Detener" style="display:none">■</button>
        <button id="btn-start" class="btn-icon" title="Iniciar">▶</button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="input-area">
      <div id="input-wrapper">
        <textarea id="input" rows="1" placeholder="Escribe tu instrucción..." disabled></textarea>
        <button id="btn-send" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
